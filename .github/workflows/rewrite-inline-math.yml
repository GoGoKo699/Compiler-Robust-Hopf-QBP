name: rewrite inline mathematics

on:
  push:
    branches:
      - inline-math-rendering-clean-2026-09
    paths:
      - scripts/rewrite_inline_math.py
      - .github/workflows/rewrite-inline-math.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: inline-math-rendering-clean-2026-09
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prevent duplicate conversion inside ket labels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/rewrite_inline_math.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_kets(text: str) -> str:
              def ket(match: re.Match[str]) -> str:
                  label = convert_atoms(match.group(1))
                  return rf"\\lvert {label}\\rangle"

              return re.sub(r"\\|([^|>]+)>", ket, text)
          '''
          new = '''def replace_kets(text: str) -> str:
              def ket(match: re.Match[str]) -> str:
                  return rf"\\lvert {match.group(1)}\\rangle"

              return re.sub(r"\\|([^|>]+)>", ket, text)
          '''
          if old not in text:
              raise SystemExit('Expected ket conversion block was not found.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Rewrite mathematical code spans
        run: python scripts/rewrite_inline_math.py

      - name: List remaining prose code spans
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from scripts.rewrite_inline_math import SCIENTIFIC_MARKDOWN, is_table_line

          inline = re.compile(r'`([^`\n]+)`')
          for relative in SCIENTIFIC_MARKDOWN:
              path = Path(relative)
              in_fence = False
              for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.lstrip().startswith('```'):
                      in_fence = not in_fence
                      continue
                  if in_fence or is_table_line(line):
                      continue
                  for span in inline.findall(line):
                      print(f'{relative}:{line_number}: `{span}`')
          PY

      - name: Check the generated patch
        run: git diff --check

      - name: Commit the generated prose patch
        run: |
          if git diff --quiet; then
            echo 'No rewrite was needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md REVIEW.md docs compiler_robust_hopf/README.md manuscript/README.md
          git commit -m 'Render mathematical symbols in scientific prose'
          git push origin HEAD:inline-math-rendering-clean-2026-09
