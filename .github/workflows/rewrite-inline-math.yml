name: rewrite inline mathematics

on:
  push:
    branches:
      - inline-math-rendering-clean-2026-09
    paths:
      - .github/workflows/rewrite-inline-math.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the working branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: inline-math-rendering-clean-2026-09
          fetch-depth: 0

      - name: Repair inline LaTeX edge cases
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'REVIEW.md': {
                  r'$[0,\\frac{pi}{2}]$': r'$[0,\pi/2]$',
                  r'$C_pXC_pX=I$': r'$C_p X C_p X=I$',
              },
              'docs/CLEAN_ROOM_ALL_WORKSPACE_REVIEW.md': {
                  r'$cos(\\frac{pi}{2})$': r'$\cos(\pi/2)$',
                  r'$C_pXC_pX=I$': r'$C_p X C_p X=I$',
                  r'$1\leqm<4n$': r'$1\leq m<4n$',
              },
              'docs/COMPILER_BOUNDARIES.md': {
                  r'$\\frac{pi}{4}$': r'$\pi/4$',
              },
              'docs/COMPILER_THEOREM.md': {
                  r'$C_pXC_pX=I$': r'$C_p X C_p X=I$',
              },
              'docs/PROOF_AUDIT.md': {
                  r'$1\leqm<4n$': r'$1\leq m<4n$',
              },
              'docs/STRICT_ZERO_BORROWED_SUFFIX_ECHO.md': {
                  r'$C_pXC_pX=I$': r'$C_p X C_p X=I$',
              },
              'docs/UNIFIED_YUAN_ZHANG_COMPILER.md': {
                  r'$1\leqm<4n$': r'$1\leq m<4n$',
              },
              'manuscript/README.md': {
                  r'$[0,\\frac{pi}{2}]$': r'$[0,\pi/2]$',
              },
          }

          changed = []
          for relative, mapping in replacements.items():
              path = Path(relative)
              original = path.read_text(encoding='utf-8')
              updated = original
              for source, target in mapping.items():
                  updated = updated.replace(source, target)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(relative)

          print(f'Updated {len(changed)} files.')
          for relative in changed:
              print(relative)
          PY

      - name: Check the generated patch
        run: git diff --check

      - name: Commit the repaired prose mathematics
        run: |
          if git diff --quiet -- REVIEW.md docs manuscript/README.md; then
            echo 'No repair was needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REVIEW.md docs manuscript/README.md
          git commit -m 'Repair inline LaTeX rendering edge cases'
          git push origin HEAD:inline-math-rendering-clean-2026-09
