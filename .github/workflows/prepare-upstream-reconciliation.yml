name: prepare-upstream-reconciliation

on:
  push:
    branches: [prepare-upstream-reconciliation-20260907]

permissions:
  contents: write

jobs:
  prepare-clean-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce the checked tree, validate, and publish the clean branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENBLAS_NUM_THREADS: '1'
        run: python _prepare_upstream_reconciliation.py
