name: prepare-upstream-reconciliation

on:
  push:
    branches: [prepare-upstream-reconciliation-20260907]

permissions:
  contents: write

jobs:
  prepare-clean-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install existing numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the complete patch and publish its content changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('_prepare_upstream_reconciliation.py').read_text(encoding='utf-8')
          # The complete eight-file tree is validated first. The runner token
          # may publish content, but not workflow changes. The workflow update
          # will be applied separately through the authorized repository tool.
          marker = "run('git', 'commit', '-m', 'Reconcile the reviewed Hopf-QBP baseline and clarify magnitude scope')"
          replacement = (
              "run('git', 'restore', '--source=' + BASE, '--staged', '--worktree', '.github/workflows/upstream-sync-audit.yml')\n"
              + marker
          )
          assert source.count(marker) == 1
          exec(compile(source.replace(marker, replacement), '_prepare_upstream_reconciliation.py', 'exec'))
          PY
