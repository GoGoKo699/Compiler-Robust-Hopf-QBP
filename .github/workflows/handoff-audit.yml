name: final-handoff-audit
on:
  push:
    branches: [handoff-audit-e2bc1e7-20260906]
permissions:
  contents: read
jobs:
  frozen-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e2bc1e7d3959453b478e36888617b398966e6f8e
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record immutable source and tree
        run: |
          mkdir -p "$RUNNER_TEMP/handoff-evidence"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/handoff-evidence/snapshot.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/handoff-evidence/blob-manifest.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/handoff-evidence/source.zip"
      - name: Install mathematical validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-run numerical and resource checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q compiler_robust_hopf scripts tests validate.py
          python scripts/reviewer_walkthrough.py 2>&1 | tee "$RUNNER_TEMP/handoff-evidence/walkthrough.log"
          python validate.py 2>&1 | tee "$RUNNER_TEMP/handoff-evidence/validation.log"
          python scripts/unified_resource_ledger.py --n 12 2>&1 | tee "$RUNNER_TEMP/handoff-evidence/unified-ledger.log"
          python scripts/strict_zero_echo_ledger.py --n 12 2>&1 | tee "$RUNNER_TEMP/handoff-evidence/strict-zero-ledger.log"
          python scripts/check_upstream_sync.py --offline 2>&1 | tee "$RUNNER_TEMP/handoff-evidence/provenance.log"
      - name: Install isolated presentation dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install -r requirements-presentation.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/hopf-mathjax" --ignore-scripts --no-audit --no-fund mathjax-full@3.2.1
      - name: Re-run browser presentation audit
        if: matrix.python-version == '3.13'
        run: |
          python scripts/check_presentation.py --mathjax "$RUNNER_TEMP/hopf-mathjax/node_modules/mathjax-full/es5/tex-svg-full.js" --output "$RUNNER_TEMP/handoff-evidence/presentation"
      - name: Retain audit evidence privately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-handoff-${{ matrix.python-version }}
          path: ${{ runner.temp }}/handoff-evidence
          retention-days: 14
          if-no-files-found: error
