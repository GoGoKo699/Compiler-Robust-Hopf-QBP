name: inline-math-audit

on:
  push:
    branches:
      - inline-math-rendering-2026-09-v2
    paths:
      - scripts/audit_inline_math.py
      - .github/workflows/inline-math-audit.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: inline-math-rendering-2026-09-v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build inline-code inventory
        run: python scripts/audit_inline_math.py
      - name: Commit inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add provenance/inline_math_candidates.txt
          git commit -m "Record inline mathematical code-span inventory"
          git push origin HEAD:inline-math-rendering-2026-09-v2
