name: presentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rendered-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install isolated presentation dependencies
        run: |
          python -m pip install -r requirements-presentation.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/hopf-mathjax" --ignore-scripts --no-audit --no-fund mathjax-full@3.2.1
      - name: Check rendered diagrams and inline mathematics
        run: |
          python scripts/check_presentation.py \
            --mathjax "$RUNNER_TEMP/hopf-mathjax/node_modules/mathjax-full/es5/tex-svg-full.js" \
            --output "$RUNNER_TEMP/hopf-presentation"
      - name: Retain visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: presentation-previews
          path: ${{ runner.temp }}/hopf-presentation
          retention-days: 14
          if-no-files-found: warn
