[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-robust-hopf-qbp"
version = "0.4.0a0"
description = "Exact compilation of prescribed Hopf differential frames at the all-workspace state-preparation frontier."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["compiler_robust_hopf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
