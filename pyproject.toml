[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-robust-hopf-qbp"
version = "1.0.1"
description = "Exact and fault-tolerant compilation of prescribed Hopf differential frames with explicit workspace and accuracy contracts."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["compiler_robust_hopf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
