<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchy of exact quantum synthesis tasks</title>
  <desc id="desc">Four cards compare quantum state preparation, controlled state preparation, Hopf differential-frame compilation, and general unitary synthesis. The Hopf frame is shown as a structured complete-unitary problem between state preparation and generic unitary synthesis.</desc>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#19324d">Where Hopf-frame compilation sits</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52677b">More columns are prescribed from left to right; structural freedom decreases.</text>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8ca0b3" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a6"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="35" y="110" width="250" height="245" rx="14" fill="#ffffff" stroke="#b6c6d5" stroke-width="2"/>
    <rect x="315" y="110" width="250" height="245" rx="14" fill="#ffffff" stroke="#b6c6d5" stroke-width="2"/>
    <rect x="595" y="96" width="270" height="273" rx="16" fill="#edf6ff" stroke="#2d6f9f" stroke-width="3"/>
    <rect x="895" y="110" width="270" height="245" rx="14" fill="#ffffff" stroke="#b6c6d5" stroke-width="2"/>
  </g>

  <line x1="285" y1="232" x2="311" y2="232" stroke="#7890a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="565" y1="232" x2="591" y2="232" stroke="#7890a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="865" y1="232" x2="891" y2="232" stroke="#7890a6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="160" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#19324d">QSP</text>
  <text x="160" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52677b">One prepared column</text>
  <rect x="75" y="199" width="170" height="72" rx="8" fill="#f3f7fa" stroke="#c8d4df"/>
  <line x1="96" y1="214" x2="96" y2="256" stroke="#2d6f9f" stroke-width="7"/>
  <line x1="130" y1="214" x2="130" y2="256" stroke="#d8e1e8" stroke-width="7"/>
  <line x1="164" y1="214" x2="164" y2="256" stroke="#d8e1e8" stroke-width="7"/>
  <line x1="198" y1="214" x2="198" y2="256" stroke="#d8e1e8" stroke-width="7"/>
  <text x="160" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">Other columns are free.</text>
  <text x="160" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">Family size: Θ(N)</text>

  <text x="440" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#19324d">CQSP</text>
  <text x="440" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52677b">Indexed prepared columns</text>
  <rect x="355" y="199" width="170" height="72" rx="8" fill="#f3f7fa" stroke="#c8d4df"/>
  <line x1="376" y1="214" x2="376" y2="256" stroke="#2d6f9f" stroke-width="7"/>
  <line x1="410" y1="214" x2="410" y2="256" stroke="#2d6f9f" stroke-width="7"/>
  <line x1="444" y1="214" x2="444" y2="256" stroke="#2d6f9f" stroke-width="7"/>
  <line x1="478" y1="214" x2="478" y2="256" stroke="#d8e1e8" stroke-width="7"/>
  <text x="440" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">Outside the indexed subspace,</text>
  <text x="440" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">the action remains free.</text>

  <text x="730" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#174f78">Hopf differential frame</text>
  <text x="730" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52677b">Structured complete unitary</text>
  <rect x="635" y="191" width="190" height="83" rx="8" fill="#ffffff" stroke="#8ab5d4"/>
  <line x1="657" y1="207" x2="657" y2="258" stroke="#2d6f9f" stroke-width="7"/>
  <line x1="694" y1="207" x2="694" y2="258" stroke="#6ba4ca" stroke-width="7"/>
  <line x1="731" y1="207" x2="731" y2="258" stroke="#6ba4ca" stroke-width="7"/>
  <line x1="768" y1="207" x2="768" y2="258" stroke="#6ba4ca" stroke-width="7"/>
  <line x1="805" y1="207" x2="805" y2="258" stroke="#6ba4ca" stroke-width="7"/>
  <text x="730" y="301" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">State and marker columns fixed.</text>
  <text x="730" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">Balanced tree with O(N) parameters.</text>
  <text x="730" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#174f78">This repository</text>

  <text x="1030" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#19324d">General unitary synthesis</text>
  <text x="1030" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52677b">Unstructured complete unitary</text>
  <rect x="935" y="199" width="190" height="72" rx="8" fill="#f3f7fa" stroke="#c8d4df"/>
  <line x1="957" y1="214" x2="957" y2="256" stroke="#5f7790" stroke-width="7"/>
  <line x1="994" y1="214" x2="994" y2="256" stroke="#5f7790" stroke-width="7"/>
  <line x1="1031" y1="214" x2="1031" y2="256" stroke="#5f7790" stroke-width="7"/>
  <line x1="1068" y1="214" x2="1068" y2="256" stroke="#5f7790" stroke-width="7"/>
  <line x1="1105" y1="214" x2="1105" y2="256" stroke="#5f7790" stroke-width="7"/>
  <text x="1030" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">Every column is prescribed.</text>
  <text x="1030" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334e68">Generic family size: Θ(N²)</text>

  <text x="600" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52677b">The theorem asks whether the highlighted structured completion can retain the optimal QSP frontier.</text>
</svg>
