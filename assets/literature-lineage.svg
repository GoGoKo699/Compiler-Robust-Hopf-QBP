<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Compiler and Hopf lineages leading to the theorem</title>
  <desc id="desc">The upper line runs from multiplexed rotations through state-preparation tradeoffs to the uniform all-workspace framework. The lower line runs from the Hopf chart through the differential frame to the inverse-frame gradient record. The lines meet in the optimal Hopf-frame compiler.</desc>
  <rect width="1200" height="500" fill="#f8fafc"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8ca0b3" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#477a9d"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4e876f"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#19324d">Two lines meet in one structured-completion theorem</text>

  <text x="55" y="105" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2d6f9f">Circuit-synthesis line</text>
  <text x="55" y="335" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#3b826b">Hopf-interface line</text>

  <g filter="url(#shadow)">
    <rect x="55" y="128" width="225" height="92" rx="12" fill="#ffffff" stroke="#aac1d2" stroke-width="2"/>
    <rect x="330" y="128" width="225" height="92" rx="12" fill="#ffffff" stroke="#aac1d2" stroke-width="2"/>
    <rect x="605" y="128" width="250" height="92" rx="12" fill="#edf6ff" stroke="#2d6f9f" stroke-width="2.5"/>

    <rect x="55" y="358" width="225" height="92" rx="12" fill="#ffffff" stroke="#b6cfc4" stroke-width="2"/>
    <rect x="330" y="358" width="225" height="92" rx="12" fill="#ffffff" stroke="#b6cfc4" stroke-width="2"/>
    <rect x="605" y="358" width="250" height="92" rx="12" fill="#eef8f4" stroke="#3b826b" stroke-width="2.5"/>

    <rect x="920" y="215" width="235" height="150" rx="16" fill="#f3f1fb" stroke="#6f63a6" stroke-width="3"/>
  </g>

  <text x="168" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#19324d">Möttönen / Bergholm</text>
  <text x="168" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">multiplexed rotations</text>
  <text x="168" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">and general UCGs</text>

  <text x="443" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#19324d">State-preparation tradeoffs</text>
  <text x="443" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">ancillary qubits</text>
  <text x="443" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">versus circuit depth</text>

  <text x="730" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#174f78">Uniform all-workspace framework</text>
  <text x="730" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">optimal QSP frontier</text>
  <text x="730" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">MCT, UCG, copy–uncopy</text>

  <text x="168" y="393" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#19324d">Balanced Hopf chart</text>
  <text x="168" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">state map, metric,</text>
  <text x="168" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">coordinate directions</text>

  <text x="443" y="393" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#19324d">Differential frame</text>
  <text x="443" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">state and prescribed</text>
  <text x="443" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">marker columns</text>

  <text x="730" y="393" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#255f4e">Inverse-frame QBP record</text>
  <text x="730" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">shared magnitude outcomes</text>
  <text x="730" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">and direct phase stream</text>

  <line x1="280" y1="174" x2="326" y2="174" stroke="#477a9d" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="555" y1="174" x2="601" y2="174" stroke="#477a9d" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="855" y1="174" x2="925" y2="235" stroke="#477a9d" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <line x1="280" y1="404" x2="326" y2="404" stroke="#4e876f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="555" y1="404" x2="601" y2="404" stroke="#4e876f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="855" y1="404" x2="925" y2="345" stroke="#4e876f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <text x="1038" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4d4382">Optimal Hopf-frame</text>
  <text x="1038" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4d4382">compiler</text>
  <text x="1038" y="311" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">same size–depth frontier</text>
  <text x="1038" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52677b">for a prescribed structured unitary</text>

  <text x="600" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#66798a">The state-preparation primitives are adapted after the complete Hopf-frame structure is made explicit.</text>
</svg>
