<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">State-preparation and Hopf lines meeting in optimal frame compilation</title>
  <desc id="desc">The upper line follows uniformly controlled gates through state-preparation time-space tradeoffs to the optimal all-workspace frontier. The lower line follows the Hopf chart through its differential frame and inverse-frame gradient interface. The present compiler joins both lines.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#61788d"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243746}
      .lane{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526b7b;letter-spacing:.5px}
      .label{font:600 19px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304b5d}
      .body{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#465f70}
      .small{font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526b7b}
      .box{fill:#ffffff;stroke:#91a8b9;stroke-width:2}
      .box2{fill:#e8f1f7;stroke:#6e8ba3;stroke-width:2}
      .current{fill:#d9e8f2;stroke:#526f85;stroke-width:3}
      .edge{stroke:#61788d;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1400" height="640" rx="22" fill="#f8fbfd"/>
  <text x="700" y="47" text-anchor="middle" class="title">Two technical lines meet in the prescribed-completion compiler</text>

  <text id="state-preparation-lane" x="55" y="96" class="lane">STATE-PREPARATION LINE</text>
  <rect id="upper-stage-1" data-disjoint-panel="true" x="55" y="115" width="275" height="112" rx="14" class="box"/>
  <text x="192.5" y="153" text-anchor="middle" class="label">Multiplexed rotations</text>
  <text x="192.5" y="179" text-anchor="middle" class="body">uniformly controlled gates</text>
  <text x="192.5" y="202" text-anchor="middle" class="small">exact state loading</text>

  <line x1="330" y1="171" x2="373" y2="171" class="edge" marker-end="url(#arrow)"/>
  <rect id="upper-stage-2" data-disjoint-panel="true" x="385" y="115" width="275" height="112" rx="14" class="box"/>
  <text x="522.5" y="153" text-anchor="middle" class="label">Time–space tradeoffs</text>
  <text x="522.5" y="179" text-anchor="middle" class="body">ancillary qubits reduce depth</text>
  <text x="522.5" y="202" text-anchor="middle" class="small">exact clean-workspace circuits</text>

  <line x1="660" y1="171" x2="703" y2="171" class="edge" marker-end="url(#arrow)"/>
  <rect id="upper-stage-3" data-disjoint-panel="true" x="715" y="115" width="285" height="112" rx="14" class="box2"/>
  <text x="857.5" y="153" text-anchor="middle" class="label">All-workspace frontier</text>
  <text x="857.5" y="179" text-anchor="middle" class="body">optimal QSP for every m</text>
  <text x="857.5" y="202" text-anchor="middle" class="small">MCT, UCG, copy primitives</text>

  <text id="hopf-lane" x="55" y="357" class="lane">HOPF LINE</text>
  <rect id="lower-stage-1" data-disjoint-panel="true" x="55" y="376" width="275" height="112" rx="14" class="box"/>
  <text x="192.5" y="414" text-anchor="middle" class="label">Hopf chart</text>
  <text x="192.5" y="440" text-anchor="middle" class="body">state, inverse, metric</text>
  <text x="192.5" y="463" text-anchor="middle" class="small">coordinate directions</text>

  <line x1="330" y1="432" x2="373" y2="432" class="edge" marker-end="url(#arrow)"/>
  <rect id="lower-stage-2" data-disjoint-panel="true" x="385" y="376" width="275" height="112" rx="14" class="box"/>
  <text x="522.5" y="414" text-anchor="middle" class="label">Differential frame</text>
  <text x="522.5" y="440" text-anchor="middle" class="body">state and marker columns</text>
  <text x="522.5" y="463" text-anchor="middle" class="small">prescribed completion W</text>

  <line x1="660" y1="432" x2="703" y2="432" class="edge" marker-end="url(#arrow)"/>
  <rect id="lower-stage-3" data-disjoint-panel="true" x="715" y="376" width="285" height="112" rx="14" class="box2"/>
  <text x="857.5" y="414" text-anchor="middle" class="label">Inverse-frame gradient</text>
  <text x="857.5" y="440" text-anchor="middle" class="body">one shared response record</text>
  <text x="857.5" y="463" text-anchor="middle" class="small">compiler must preserve W</text>

  <path data-arrow-target="compiler-result" d="M1000,171 H1045 V287 H1087" class="edge" marker-end="url(#arrow)"/>
  <path data-arrow-target="compiler-result" d="M1000,432 H1045 V341 H1087" class="edge" marker-end="url(#arrow)"/>

  <rect id="compiler-result" data-disjoint-panel="true" x="1090" y="244" width="275" height="140" rx="17" class="current"/>
  <text x="1227.5" y="278" text-anchor="middle" class="label">Hopf frame compiler</text>
  <text x="1227.5" y="307" text-anchor="middle" class="body">preserves the complete frame</text>
  <text x="1227.5" y="333" text-anchor="middle" class="body">at the optimal QSP frontier</text>
  <text x="1227.5" y="359" text-anchor="middle" class="small">every clean-workspace budget</text>

  <rect x="90" y="530" width="1220" height="82" rx="14" fill="#edf4f8" stroke="#8da5b7" stroke-width="2"/>
  <text x="700" y="561" text-anchor="middle" class="body">Once the Hopf frame is exposed as addressed complete-operator layers, the state-preparation toolkit can be adapted.</text>
  <text x="700" y="589" text-anchor="middle" class="body">The new ingredients are the frame contract, Hopf layer factorization, and the three workspace schedules.</text>
</svg>
