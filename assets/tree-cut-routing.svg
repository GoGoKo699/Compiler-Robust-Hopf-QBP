<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Tree cut and routed parallel subtree frames</title>
  <desc id="desc">The first t Hopf depths form a conditioned prefix. Below the cut, the frame is a direct sum of subtree frames. A coherent router sends the suffix data to one selected branch, the branch frames run in parallel, and inverse routing restores all workspace.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#61788d"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243746}
      .label{font:600 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304b5d}
      .body{font:18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#465f70}
      .small{font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526b7b}
      .math{font:21px Georgia,"Times New Roman",serif;fill:#233746}
      .edge{stroke:#70879a;stroke-width:3;fill:none}
      .thin{stroke:#9aafbf;stroke-width:2;fill:none}
      .node{fill:#e7f0f6;stroke:#6e8ba3;stroke-width:2}
      .leaf{fill:#f7fafc;stroke:#91a6b6;stroke-width:2}
      .branch{fill:#eef4f8;stroke:#7d97aa;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="680" rx="22" fill="#f8fbfd"/>
  <text x="700" y="48" text-anchor="middle" class="title">Positive workspace: cut the Hopf tree, route once, run subframes in parallel</text>

  <!-- tree -->
  <g transform="translate(65,90)">
    <circle cx="250" cy="40" r="23" class="node"/>
    <line x1="235" y1="58" x2="145" y2="120" class="edge"/>
    <line x1="265" y1="58" x2="355" y2="120" class="edge"/>
    <circle cx="130" cy="135" r="21" class="node"/>
    <circle cx="370" cy="135" r="21" class="node"/>
    <line x1="116" y1="152" x2="55" y2="215" class="edge"/>
    <line x1="144" y1="152" x2="205" y2="215" class="edge"/>
    <line x1="356" y1="152" x2="295" y2="215" class="edge"/>
    <line x1="384" y1="152" x2="445" y2="215" class="edge"/>
    <circle cx="40" cy="230" r="19" class="leaf"/>
    <circle cx="220" cy="230" r="19" class="leaf"/>
    <circle cx="280" cy="230" r="19" class="leaf"/>
    <circle cx="460" cy="230" r="19" class="leaf"/>
    <line x1="20" y1="280" x2="480" y2="280" stroke="#61788d" stroke-width="4" stroke-dasharray="12 8"/>
    <text id="cut-label" data-clear-connectors="true" x="250" y="307" text-anchor="middle" class="label"><tspan x="250">cut after </tspan><tspan x="250" dy="27">t depths</tspan></text>
    <path d="M40,249 C20,315 15,345 15,390" class="thin"/>
    <path d="M220,249 C165,294 180,340 198,390" class="thin"/>
    <path d="M280,249 C335,294 320,340 338,390" class="thin"/>
    <path d="M460,249 C480,315 485,345 485,390" class="thin"/>
    <rect x="-20" y="390" width="115" height="85" rx="12" class="branch"/>
    <rect x="140" y="390" width="115" height="85" rx="12" class="branch"/>
    <rect x="280" y="390" width="115" height="85" rx="12" class="branch"/>
    <rect x="440" y="390" width="115" height="85" rx="12" class="branch"/>
    <text x="38" y="425" text-anchor="middle" class="math">Wₛ⁽⁰⁾</text>
    <text x="198" y="425" text-anchor="middle" class="math">Wₛ⁽¹⁾</text>
    <text x="338" y="425" text-anchor="middle" class="math">…</text>
    <text x="498" y="425" text-anchor="middle" class="math">Wₛ⁽ᴮ⁻¹⁾</text>
    <text x="268" y="510" text-anchor="middle" class="math">Rₜ⁽ⁿ⁾ = ⨁ᵣ Wₛ⁽ʳ⁾</text>
  </g>

  <!-- process -->
  <g transform="translate(690,105)">
    <rect x="0" y="0" width="590" height="490" rx="18" fill="#ffffff" stroke="#91a8b9" stroke-width="2"/>
    <text x="295" y="42" text-anchor="middle" class="label">Coherent route–operate–unroute schedule</text>

    <rect x="55" y="78" width="200" height="72" rx="12" class="node"/>
    <text x="155" y="108" text-anchor="middle" class="label">system input</text>
    <text x="155" y="135" text-anchor="middle" class="math">|p⟩|ξ⟩</text>

    <line x1="255" y1="114" x2="333" y2="114" class="edge" marker-end="url(#arrow)"/>
    <rect x="345" y="78" width="190" height="72" rx="12" class="node"/>
    <text x="440" y="108" text-anchor="middle" class="label">router</text>
    <text x="440" y="135" text-anchor="middle" class="small">selected branch r=p</text>

    <line x1="440" y1="150" x2="440" y2="203" class="edge" marker-end="url(#arrow)"/>
    <rect x="55" y="215" width="480" height="108" rx="14" class="branch"/>
    <text x="295" y="247" text-anchor="middle" class="label">all B controlled subtree frames</text>
    <rect x="78" y="266" width="92" height="38" rx="8" fill="#fff" stroke="#8ca4b6"/>
    <rect x="186" y="266" width="92" height="38" rx="8" fill="#fff" stroke="#8ca4b6"/>
    <rect x="294" y="266" width="92" height="38" rx="8" fill="#fff" stroke="#8ca4b6"/>
    <rect x="402" y="266" width="105" height="38" rx="8" fill="#fff" stroke="#8ca4b6"/>
    <text x="124" y="292" text-anchor="middle" class="math">Wₛ⁽⁰⁾</text>
    <text x="232" y="292" text-anchor="middle" class="math">Wₛ⁽¹⁾</text>
    <text x="340" y="292" text-anchor="middle" class="math">…</text>
    <text x="454" y="292" text-anchor="middle" class="math">Wₛ⁽ᴮ⁻¹⁾</text>
    <text x="295" y="345" text-anchor="middle" class="small">disjoint registers ⇒ parallel depth</text>

    <line x1="295" y1="356" x2="295" y2="388" class="edge" marker-end="url(#arrow)"/>
    <rect id="inverse-router-box" x="55" y="400" width="480" height="76" rx="12" class="node"/>
    <text id="inverse-router-caption" x="295" y="430" text-anchor="middle" class="body"><tspan x="295">inverse router restores the suffix </tspan><tspan x="295" dy="25">and returns every work register to |0⟩</tspan></text>
  </g>

  <rect x="115" y="610" width="1170" height="46" rx="12" fill="#edf4f8" stroke="#8da5b7"/>
  <text x="700" y="640" text-anchor="middle" class="math">B=2ᵗ, s=n−t, peak clean workspace ≤ 2B(s+1), total branch size B·O(2ˢ)=O(2ⁿ)</text>
</svg>
