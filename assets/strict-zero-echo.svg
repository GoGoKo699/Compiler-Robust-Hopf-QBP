<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Strict-zero borrowed-suffix echo</title>
  <desc id="desc">Four wires show the prefix, Hopf target, borrowed suffix bit, and remaining suffix. The chronological sequence alternates two target echoes, two half-angle uniformly controlled gates, and four predicate toggles, restoring the borrowed bit exactly.</desc>
  <defs>
    <style>
      .title{font:700 30px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243746}
      .label{font:600 21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#304b5d}
      .body{font:18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#465f70}
      .small{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526b7b}
      .math{font:21px Georgia,"Times New Roman",serif;fill:#233746}
      .wire{stroke:#6d8293;stroke-width:3}
      .control{fill:#526f85}
      .open{fill:#fff;stroke:#526f85;stroke-width:3}
      .gate{fill:#e7f0f6;stroke:#6e8ba3;stroke-width:2}
      .echo{fill:#f4f7f9;stroke:#7d93a5;stroke-width:2}
      .toggle{fill:#dbe9f2;stroke:#617f96;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="620" rx="22" fill="#f8fbfd"/>
  <text x="700" y="48" text-anchor="middle" class="title">Strict-zero schedule: borrow one logical suffix bit and restore it</text>
  <text x="700" y="80" text-anchor="middle" class="body">Read from left to right. No ancillary wire is introduced.</text>

  <text x="55" y="160" class="label">prefix p</text>
  <text x="55" y="250" class="label">target x</text>
  <text x="55" y="340" class="label">borrowed b</text>
  <text x="55" y="430" class="label">suffix r</text>
  <line x1="210" y1="153" x2="1340" y2="153" class="wire"/>
  <line x1="210" y1="243" x2="1340" y2="243" class="wire"/>
  <line x1="210" y1="333" x2="1340" y2="333" class="wire"/>
  <line x1="210" y1="423" x2="1340" y2="423" class="wire"/>

  <!-- controlled X -->
  <line x1="275" y1="243" x2="275" y2="333" stroke="#526f85" stroke-width="3"/>
  <circle cx="275" cy="333" r="7" class="control"/>
  <circle cx="275" cy="243" r="23" class="echo"/>
  <line x1="260" y1="228" x2="290" y2="258" stroke="#526f85" stroke-width="3"/>
  <line x1="290" y1="228" x2="260" y2="258" stroke="#526f85" stroke-width="3"/>

  <!-- T_h 1 -->
  <line x1="405" y1="333" x2="405" y2="423" stroke="#526f85" stroke-width="3"/>
  <circle cx="405" cy="423" r="8" class="open"/>
  <rect x="377" y="307" width="56" height="52" rx="8" class="toggle"/>
  <text x="405" y="340" text-anchor="middle" class="math">X</text>
  <text x="405" y="464" text-anchor="middle" class="small">Tₕ</text>

  <!-- C_p 1 -->
  <line x1="545" y1="153" x2="545" y2="333" stroke="#526f85" stroke-width="3"/>
  <circle cx="545" cy="153" r="7" class="control"/>
  <circle cx="545" cy="333" r="7" class="control"/>
  <rect x="496" y="213" width="98" height="60" rx="9" class="gate"/>
  <text x="545" y="249" text-anchor="middle" class="math">Cₚ</text>
  <text x="545" y="300" text-anchor="middle" class="small">one UCG</text>

  <!-- T_h 2 -->
  <line x1="675" y1="333" x2="675" y2="423" stroke="#526f85" stroke-width="3"/>
  <circle cx="675" cy="423" r="8" class="open"/>
  <rect x="647" y="307" width="56" height="52" rx="8" class="toggle"/>
  <text x="675" y="340" text-anchor="middle" class="math">X</text>
  <text x="675" y="464" text-anchor="middle" class="small">Tₕ</text>

  <!-- controlled X 2 -->
  <line x1="805" y1="243" x2="805" y2="333" stroke="#526f85" stroke-width="3"/>
  <circle cx="805" cy="333" r="7" class="control"/>
  <circle cx="805" cy="243" r="23" class="echo"/>
  <line x1="790" y1="228" x2="820" y2="258" stroke="#526f85" stroke-width="3"/>
  <line x1="820" y1="228" x2="790" y2="258" stroke="#526f85" stroke-width="3"/>

  <!-- T_h 3 -->
  <line x1="935" y1="333" x2="935" y2="423" stroke="#526f85" stroke-width="3"/>
  <circle cx="935" cy="423" r="8" class="open"/>
  <rect x="907" y="307" width="56" height="52" rx="8" class="toggle"/>
  <text x="935" y="340" text-anchor="middle" class="math">X</text>
  <text x="935" y="464" text-anchor="middle" class="small">Tₕ</text>

  <!-- C_p 2 -->
  <line x1="1075" y1="153" x2="1075" y2="333" stroke="#526f85" stroke-width="3"/>
  <circle cx="1075" cy="153" r="7" class="control"/>
  <circle cx="1075" cy="333" r="7" class="control"/>
  <rect x="1026" y="213" width="98" height="60" rx="9" class="gate"/>
  <text x="1075" y="249" text-anchor="middle" class="math">Cₚ</text>
  <text x="1075" y="300" text-anchor="middle" class="small">one UCG</text>

  <!-- T_h 4 -->
  <line x1="1205" y1="333" x2="1205" y2="423" stroke="#526f85" stroke-width="3"/>
  <circle cx="1205" cy="423" r="8" class="open"/>
  <rect x="1177" y="307" width="56" height="52" rx="8" class="toggle"/>
  <text x="1205" y="340" text-anchor="middle" class="math">X</text>
  <text x="1205" y="464" text-anchor="middle" class="small">Tₕ</text>

  <rect x="135" y="503" width="1130" height="78" rx="14" fill="#edf4f8" stroke="#8da5b7" stroke-width="2"/>
  <text x="700" y="535" text-anchor="middle" class="math">Cₚ = Rᵧ(θₚ/2),   Tₕ : b ↦ b ⊕ [r=0]</text>
  <text x="700" y="565" text-anchor="middle" class="body">The active sector receives Cₚ²=Rᵧ(θₚ); the unwanted borrowed-bit sector cancels because X Cₚ X=Cₚ⁻¹.</text>
</svg>
